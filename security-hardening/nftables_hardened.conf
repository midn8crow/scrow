#!/usr/bin/nft -f
# Heavy-duty hardened nftables firewall

flush ruleset

table inet filter {
    set ratelimit {
        type ipv4_addr
        flags dynamic, timeout
        timeout 60s
    }

    set blacklisted {
        type ipv4_addr
        flags dynamic, timeout
        timeout 3600s
    }

    set portscanners {
        type ipv4_addr
        flags dynamic, timeout
        timeout 86400s
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # Allow established/related
        ct state {established, related} accept

        # Drop invalid
        ct state invalid drop

        # Loopback
        iif lo accept

        # ICMP (rate limited)
        meta l4proto icmp limit rate 5/second accept
        meta l4proto icmpv6 limit rate 5/second accept

        # Block blacklisted IPs
        ip saddr @blacklisted counter drop

        # Block port scanners
        ip saddr @portscanners counter drop

        # SSH (rate limited - 3 attempts per minute, then blacklist)
        tcp dport ssh meter ssh_meter { ip saddr limit rate 3/minute burst 5 packets } accept
        tcp dport ssh counter add @blacklisted { ip saddr limit rate over 10/minute }

        # DNS
        tcp dport 53 accept
        udp dport 53 accept

        # HTTP/HTTPS (if running web server)
        # tcp dport { 80, 443 } accept

        # Block ALL dangerous ports
        tcp dport { 20, 21, 23, 25, 69, 111, 135, 137, 138, 139, 143, 445, 1433, 1434, 3306, 3389, 5432, 5900, 5901, 6379, 8080, 8443, 9200, 9300, 27017, 11211 } counter drop
        udp dport { 20, 21, 23, 69, 111, 135, 137, 138, 139, 161, 162, 445, 500, 1434, 1900, 5000, 5353, 6379, 11211, 27017 } counter drop

        # Log dropped packets (rate limited)
        limit rate 3/minute log prefix "NFT-DROP: " level warn

        # Default drop counter
        counter
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
