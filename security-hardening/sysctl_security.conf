# Heavy-duty kernel hardening
# Place in /etc/sysctl.d/99-security.conf

# === NETWORK SECURITY ===

# IP Spoofing protection
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignore ICMP redirects
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Ignore source-routed packets
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# SYN flood protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 4096
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 5

# Log suspicious packets
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1

# Ignore broadcast pings
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP errors
net.ipv4.icmp_ignore_bogus_error_responses = 1

# Disable IPv6 router advertisements
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Disable IPv6 multicast
net.ipv6.conf.all.mc_forwarding = 0

# Reverse path filtering
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# === KERNEL HARDENING ===

# ASLR (full randomization)
kernel.randomize_va_space = 2

# Restrict dmesg access
kernel.dmesg_restrict = 1

# Restrict kernel pointer exposure
kernel.kptr_restrict = 2

# Restrict perf events
kernel.perf_event_paranoid = 3

# Restrict bpf
kernel.unprivileged_bpf_disabled = 1

# Yama ptrace scope (only parent can trace child)
kernel.yama.ptrace_scope = 1

# Disable SysRq (prevents emergency key combos)
kernel.sysrq = 0

# Core dump restrictions
fs.suid_dumpable = 0

# Restrict core dumps to SIGKILL
fs/fsuid_dumpable = 0

# Protect hardlinks
fs.protected_hardlinks = 1

# Protect symlinks
fs.protected_symlinks = 1

# Restrict access to kernel logs
kernel.printk = 3 3 3 3

# Disable unprivileged user namespaces (breaks some containers)
# kernel.unprivileged_userns_clone = 0

# === TCP HARDENING ===

# Disable timestamps (prevents TCP fingerprinting)
net.ipv4.tcp_timestamps = 0

# RFC 1337 (TIME-WAIT assassination prevention)
net.ipv4.tcp_rfc1337 = 1

# Increase conntrack table size
net.netfilter.nf_conntrack_max = 1048576

# Decrease conntrack timeouts
net.netfilter.nf_conntrack_tcp_timeout_established = 432000
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 120
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 60
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 120

# === MEMORY PROTECTION ===

# Restrict access to kernel pointers
kernel.kptr_restrict = 2

# Hide kernel pointers from unprivileged users
kernel.perf_event_paranoid = 3

# Restrict unprivileged BPF
kernel.unprivileged_bpf_disabled = 1

# Restrict userfaultfd
vm.unprivileged_userfaultfd = 0
