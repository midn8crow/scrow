# Template for rclone config - copy to ~/.config/rclone/rclone.conf
# and fill in your own Google OAuth app credentials, then run:
#   rclone config reconnect gdrive:
# Never commit a real token or client_secret to this repo.

[gdrive]
type = drive
scope = drive
client_id = YOUR_GOOGLE_CLIENT_ID
client_secret = YOUR_GOOGLE_CLIENT_SECRET
